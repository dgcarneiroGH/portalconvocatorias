baseURL = "https://portalconvocatorias.es/"
locale = "es-es"
title = "Portal de Convocatorias"

[params]
  brand_long = "Ayudas y Convocatorias"
  description = "Recopilatorio actualizado diariamente de ayudas y convocatorias activas en España para asociaciones, autónomos, empresas y particulares, filtrado por territorio, tipo de beneficiario y sector."

[taxonomies]
  region = "regiones"
  beneficiario = "para"

[sitemap]
  changefreq = "daily"
  priority = 0.7
  filename = "sitemap.xml"

[permalinks]
  grants = "/:slug/"

[markup.goldmark.renderer]
  unsafe = true