<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="{{ .Permalink }}">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else if and (eq .Section "grants") (eq .Kind "page") }}{{ $tag := .Params.tag_seo }}{{ $region := index .Params.regiones 0 }}{{ if eq $tag "nominativas" }}Subvenciones nominativas en {{ $region }}{{ else }}Subvenciones de {{ $tag }} en {{ $region }}{{ end }} | {{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

{{- partial "seo-description.html" . -}}

<meta property="og:title"
  content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:locale" content="es_ES">
<meta property="og:image" content="{{ .Site.BaseURL }}og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Portal de Convocatorias - Subvenciones y ayudas activas en España">

<meta name="twitter:card" content="summary">
<meta name="twitter:title"
  content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">

<link rel="stylesheet" href="/css/main.css">

{{- partial "schemas.html" . -}}

{{- if and .Site.Params.plausibleEnabled .Site.Params.plausibleDomain }}
<script defer data-domain="{{ .Site.Params.plausibleDomain }}" src="https://plausible.io/js/script.js"></script>
{{- end }}

{{- if not .IsHome }}
<script defer src='https://static.cloudflareinsights.com/beacon.min.js'
  data-cf-beacon='{"token": "12b64ab13abd498fa9f06fc8f1cde0c7"}'></script>
{{- end }}
